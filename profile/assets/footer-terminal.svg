<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="fbg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="16" fill="url(#fbg)"/>
  <!-- Window buttons -->
  <circle cx="28" cy="22" r="5" fill="#DC2626"/>
  <circle cx="47" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="66" cy="22" r="5" fill="#16A34A"/>
  <!-- Terminal title -->
  <text x="600" y="26" text-anchor="middle" fill="#64748B" font-family="'Segoe UI',system-ui,sans-serif" font-size="11">zyntrix — engineering terminal</text>
  <!-- Separator -->
  <path d="M0 40H1200" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Command line entries -->
  <g font-family="'Cascadia Code','Fira Code',monospace" font-size="14">
    <text x="30" y="72" fill="#DC2626" font-weight="700">$</text>
    <text x="48" y="72" fill="#0A2647" font-weight="700">zyntrix status --all</text>
    
    <text x="30" y="100" fill="#64748B">architecture=</text><text x="175" y="100" fill="#0A2647" font-weight="700">clean</text>
    <text x="240" y="100" fill="#64748B">security=</text><text x="340" y="100" fill="#0A2647" font-weight="700">enabled</text>
    <text x="430" y="100" fill="#64748B">quality=</text><text x="525" y="100" fill="#0A2647" font-weight="700">automated</text>
    <text x="640" y="100" fill="#64748B">mission=</text><text x="740" y="100" fill="#16A34A" font-weight="700">active</text>
    
    <text x="30" y="130" fill="#16A34A">●</text>
    <text x="48" y="130" fill="#0A2647" font-weight="700">SYSTEMS ENGINEERING ONLINE</text>
  </g>
  <!-- Blinking cursor -->
  <rect x="350" y="116" width="9" height="16" fill="#DC2626">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Border -->
  <rect width="1200" height="150" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
