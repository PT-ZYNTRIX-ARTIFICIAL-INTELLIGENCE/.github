<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E8EDF4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="50%">
      <stop offset="0%" stop-color="#144272" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#144272" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A2647" stroke-opacity=".04" stroke-width=".8"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>

  <ellipse cx="180" cy="200" rx="320" ry="260" fill="url(#glow1)">
    <animate attributeName="rx" values="280;360;280" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;1;.6" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1020" cy="200" rx="280" ry="220" fill="url(#glow2)">
    <animate attributeName="rx" values="240;320;240" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#144272" stroke-opacity=".15" fill="none" stroke-width="1">
    <path d="M60 80H240L310 150H480"/>
    <path d="M720 260H900L970 190H1140"/>
    <path d="M70 300H200L260 240H400"/>
    <path d="M800 90H950L1010 150H1140"/>
  </g>

  <g fill="#144272" filter="url(#softGlow)">
    <circle cx="240" cy="80" r="3" opacity=".5"><animate attributeName="r" values="2;5;2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="150" r="3" opacity=".5"><animate attributeName="r" values="2;5;2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="260" r="3" opacity=".4"><animate attributeName="r" values="2;5;2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="150" r="3" opacity=".4"><animate attributeName="r" values="2;5;2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#DC2626" filter="url(#softGlow)">
    <circle cx="480" cy="150" r="2"><animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="190" r="2"><animate attributeName="opacity" values=".3;.7;.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(80 75)">
    <circle cx="105" cy="105" r="85" fill="none" stroke="#0A2647" stroke-width="1.5" stroke-opacity=".12"/>
    <circle cx="105" cy="105" r="65" fill="none" stroke="#144272" stroke-width="1.5" stroke-dasharray="6 14" opacity=".25">
      <animateTransform attributeName="transform" type="rotate" from="0 105 105" to="360 105 105" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="105" r="50" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 18" opacity=".2">
      <animateTransform attributeName="transform" type="rotate" from="360 105 105" to="0 105 105" dur="15s" repeatCount="indefinite"/>
    </circle>
    <path d="M105 30L155 62V130L105 164L55 130V62Z" fill="#FFFFFF" stroke="#0A2647" stroke-width="2.5"/>
    <path d="M78 78L105 58L132 78L105 98Z" fill="#0A2647" opacity=".9"/>
    <path d="M78 86V122L105 142V106Z" fill="#144272" opacity=".85"/>
    <path d="M132 86V122L105 142V106Z" fill="#DC2626" opacity=".75"/>
    <text x="105" y="196" text-anchor="middle" fill="#0A2647" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" letter-spacing="5" font-weight="700">ZYNTRIX CORE</text>
  </g>

  <g font-family="'Segoe UI',system-ui,sans-serif">
    <text x="360" y="120" fill="#DC2626" font-size="15" font-weight="700" letter-spacing="7">PT ZYNTRIX</text>
    <text x="360" y="175" fill="#0A2647" font-size="44" font-weight="800" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text>
    <text x="360" y="216" fill="#475569" font-size="18" letter-spacing="1">Enterprise Engineering Organization</text>
    <text x="360" y="272" fill="#64748B" font-size="13" letter-spacing="3">SECURE BY DESIGN  ·  ARCHITECTURE FIRST  ·  AUTOMATION DRIVEN</text>
    <rect x="360" y="296" width="600" height="2" rx="1" fill="#0A2647" opacity=".1"/>
    <rect x="360" y="296" width="120" height="2" rx="1" fill="#DC2626" opacity=".7">
      <animate attributeName="x" values="360;840;360" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(360 318)" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B" letter-spacing="2">
    <circle cx="0" cy="-4" r="3" fill="#16A34A">
      <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="0">SYSTEMS ONLINE</text>
    <circle cx="160" cy="-4" r="3" fill="#144272"/>
    <text x="172" y="0">ENGINEERING ACTIVE</text>
    <circle cx="345" cy="-4" r="3" fill="#DC2626"/>
    <text x="357" y="0">AI READY</text>
  </g>

  <rect x="0" y="0" width="140" height="400" fill="#0A2647" opacity=".015" rx="20">
    <animate attributeName="x" values="-140;1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="400" rx="20" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
